name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Apple Silicon only: the app targets macOS 26 and Liquid Glass, so there is no second
      # slice to guard against. Needs a runner image carrying the macOS 26 SDK and Swift 6.2.
      - name: Build native app
        working-directory: swift
        run: ./scripts/build_app.sh
