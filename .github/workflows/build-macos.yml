name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The Electron app: lint, format, types, tests and a production build. macOS, because node-pty
  # only ships prebuilt binaries for macOS and Windows and the app is macOS-only anyway.
  app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  build-check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Apple Silicon only: the app targets macOS 26 and Liquid Glass, so there is no second
      # slice to guard against. Needs a runner image carrying the macOS 26 SDK and Swift 6.2.
      - name: Build native app
        working-directory: swift
        run: ./scripts/build_app.sh
