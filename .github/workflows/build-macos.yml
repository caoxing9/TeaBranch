name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Universal, so an x86_64-only compile error can't reach main. Both slices come from
      # this one runner — see swift/scripts/build_app.sh for why --triple rather than --arch.
      - name: Build native app
        working-directory: swift
        run: ./scripts/build_app.sh --universal
