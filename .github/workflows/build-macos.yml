name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The nsh app: its Rust crate and TSX types, the headless tests, and a packaged .app the way the
  # release builds it. macOS, because the app is macOS-only and its host is AppKit.
  app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app-nsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # nsh 0.4 needs Rust 1.93 or later for the app's own crate and the runner it builds around it.
      - name: Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-nsh/native
          cache-directories: app-nsh/target

      # Pinned to the version the crate depends on (native/Cargo.toml): the two move together.
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.4.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Typecheck
        run: nsh check

      # The tests open the whole app, which starts at the onboarding screen until a repository is
      # set; this checkout stands in for one. The e2e tests under e2e/ expect a developer's machine
      # (its branches, WebKit) and are run there by hand.
      - name: Seed settings
        run: |
          dir="$HOME/Library/Application Support/com.teabranch.dev"
          mkdir -p "$dir"
          printf '{"projectPath":"%s","basePort":3001,"defaultStartCommand":"npm run dev","agentCommand":"claude"}\n' "$GITHUB_WORKSPACE" > "$dir/settings.json"

      # `nsh test <dir>` wants the app's directory, which would take the e2e tests along: the unit
      # tests are named one by one.
      - name: Unit tests
        run: |
          set -euo pipefail
          find src -name '*.test.ts' -o -name '*.test.tsx' | sort | while read -r file; do nsh test "$file"; done

      - name: Smoke test
        run: nsh test App.test.tsx

      - name: Package
        run: nsh package --target macos -o dist
