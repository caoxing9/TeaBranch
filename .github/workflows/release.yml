name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Electron app, Apple Silicon only. The tag already carries the version: semantic-release
  # stamps it into app/package.json, which electron-builder puts in the bundle and the DMG name.
  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
          # The cask update below commits back to main, which needs the credentials this keeps
          # and enough history to fast-forward onto it.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Build .app and DMG
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm dist
        env:
          # Ad-hoc signed (electron-builder.yml); don't go looking for a Developer ID in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            app/dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The cask has to be updated after the DMG exists, because its sha256 is the sha256 of that
      # DMG. `[skip ci]` keeps this from re-triggering the release workflow.
      - name: Point the Homebrew cask at the new release
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.version }}"
          DMG="app/dist/TeaBranch-$VERSION-arm64.dmg"
          test -f "$DMG"
          SHA="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"

          # The build ran against the tag, in detached HEAD. `app/dist/` is gitignored, so the
          # DMG survives the switch to main.
          git fetch origin main
          git checkout main

          /usr/bin/sed -i '' -E "s|^  version \".*\"$|  version \"$VERSION\"|" Casks/teabranch.rb
          /usr/bin/sed -i '' -E "s|^  sha256 \".*\"$|  sha256 \"$SHA\"|" Casks/teabranch.rb

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/teabranch.rb
          git diff --cached --quiet && { echo "cask already current"; exit 0; }
          git commit -m "chore(cask): TeaBranch $VERSION [skip ci]"
          git push origin main
