name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The nsh app, Apple Silicon only. The tag already carries the version: semantic-release stamps
  # it into app-nsh/nsh.json, which `nsh package` puts in the bundle; the DMG is named after it.
  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
          # The cask update below commits back to main, which needs the credentials this keeps
          # and enough history to fast-forward onto it.
          fetch-depth: 0

      - name: Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-nsh/native
          cache-directories: app-nsh/target

      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.4.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Ad hoc signed, as `nsh package` signs it; not notarized (see the cask).
      - name: Build .app and DMG
        working-directory: app-nsh
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.version }}"
          nsh package --target macos -o dist
          test -d dist/TeaBranch.app
          # The DMG holds the app and an Applications link to drag it onto.
          rm -rf dist/dmg && mkdir -p dist/dmg
          cp -R dist/TeaBranch.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname TeaBranch -srcfolder dist/dmg -ov -format UDZO "dist/TeaBranch-$VERSION-arm64.dmg"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            app-nsh/dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The cask has to be updated after the DMG exists, because its sha256 is the sha256 of that
      # DMG. `[skip ci]` keeps this from re-triggering the release workflow.
      - name: Point the Homebrew cask at the new release
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.version }}"
          DMG="app-nsh/dist/TeaBranch-$VERSION-arm64.dmg"
          test -f "$DMG"
          SHA="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"

          # The build ran against the tag, in detached HEAD. `dist/` is gitignored, so the DMG
          # survives the switch to main.
          git fetch origin main
          git checkout main

          /usr/bin/sed -i '' -E "s|^  version \".*\"$|  version \"$VERSION\"|" Casks/teabranch.rb
          /usr/bin/sed -i '' -E "s|^  sha256 \".*\"$|  sha256 \"$SHA\"|" Casks/teabranch.rb

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/teabranch.rb
          git diff --cached --quiet && { echo "cask already current"; exit 0; }
          git commit -m "chore(cask): TeaBranch $VERSION [skip ci]"
          git push origin main
